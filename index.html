<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drive & Deliver</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#111}
*{box-sizing:border-box} body{margin:0;background:#f5f5f7}
.app{max-width:430px;margin:auto;min-height:100vh;background:white}
header{padding:22px 20px 14px;border-bottom:1px solid #ddd}
h1{font-size:26px;margin:0 0 4px}.sub{color:#666;font-size:14px}
main{padding:18px 20px 100px}.card{background:#f7f7f8;border-radius:18px;padding:18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:white;border-radius:14px;padding:14px}
.label{font-size:12px;color:#777}.value{font-size:25px;font-weight:700;margin-top:5px}
button{border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:650;width:100%;cursor:pointer}
.primary{background:#111;color:white}.secondary{background:#e9e9ec;color:#111}
.row{display:flex;gap:10px}.row button{flex:1}
.hidden{display:none}.delivery{background:white;border-radius:14px;padding:14px;margin-top:9px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:12px;padding:6px 9px;border-radius:10px;background:#e8f5e9;color:#237a2d}
input{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:16px;margin:8px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:white;border-top:1px solid #ddd;display:flex}
nav button{border-radius:0;background:white;color:#555;font-size:13px;padding:13px 4px}
nav button.active{color:#111;font-weight:750}
</style>
</head>
<body>
<div class="app">
<header><h1>Drive & Deliver</h1><div class="sub">Driving mileage & delivery tracker</div></header>

<main>
<section id="drive">
  <div class="card">
    <div class="stats">
      <div class="stat"><div class="label">Distance</div><div class="value" id="distance">0.0 km</div></div>
      <div class="stat"><div class="label">Drive time</div><div class="value" id="time">00:00</div></div>
      <div class="stat"><div class="label">Deliveries</div><div class="value" id="count">0</div></div>
      <div class="stat"><div class="label">Avg / delivery</div><div class="value" id="avg">0.0 km</div></div>
    </div>
  </div>

  <div class="card">
    <div id="idle">
      <button class="primary" onclick="startDrive()">Start Drive</button>
    </div>
    <div id="active" class="hidden">
      <div class="row">
        <button class="secondary" onclick="addDelivery()">Add Delivery</button>
        <button class="primary" onclick="finishDrive()">Finish Drive</button>
      </div>
    </div>
  </div>

  <div class="card">
    <b>Today's deliveries</b>
    <div id="deliveries"><p class="sub">No deliveries yet.</p></div>
  </div>
</section>

<section id="history" class="hidden">
  <div class="card"><h2>Trip history</h2><div id="historyList"><p class="sub">No completed trips yet.</p></div></div>
</section>
</main>

<nav>
<button id="driveNav" class="active" onclick="show('drive')">🚗<br>Drive</button>
<button id="historyNav" onclick="show('history')">📊<br>History</button>
</nav>
</div>

<script>
let running=false,start=0,timer=null,distance=0,deliveries=[],trips=[];
const $=id=>document.getElementById(id);

function startDrive(){
 running=true; start=Date.now(); distance=0; deliveries=[];
 $('idle').classList.add('hidden'); $('active').classList.remove('hidden');
 render(); timer=setInterval(()=>{render();},1000);
}
function addDelivery(){
 if(!running)return;
 const n=deliveries.length+1;
 deliveries.push({n,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),distance});
 render();
}
function finishDrive(){
 if(!running)return;
 running=false; clearInterval(timer);
 const elapsed=Date.now()-start;
 trips.unshift({date:new Date().toLocaleDateString(),distance,deliveries:deliveries.length,elapsed});
 $('active').classList.add('hidden'); $('idle').classList.remove('hidden');
 renderHistory();
}
function render(){
 $('distance').textContent=distance.toFixed(1)+' km';
 $('count').textContent=deliveries.length;
 $('avg').textContent=(deliveries.length?(distance/deliveries.length):0).toFixed(1)+' km';
 const sec=running?Math.floor((Date.now()-start)/1000):0;
 $('time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
 $('deliveries').innerHTML=deliveries.length?deliveries.map(d=>`<div class="delivery"><span>Delivery ${d.n}<br><small>${d.time} · ${d.distance.toFixed(1)} km</small></span><span class="badge">Completed</span></div>`).join(''):'<p class="sub">No deliveries yet.</p>';
}
function renderHistory(){
 $('historyList').innerHTML=trips.length?trips.map(t=>`<div class="delivery"><span><b>${t.date}</b><br><small>${t.deliveries} deliveries · ${Math.floor(t.elapsed/60000)} min</small></span><b>${t.distance.toFixed(1)} km</b></div>`).join(''):'<p class="sub">No completed trips yet.</p>';
}
function show(s){
 ['drive','history'].forEach(x=>$(x).classList.toggle('hidden',x!==s));
 $('driveNav').classList.toggle('active',s==='drive'); $('historyNav').classList.toggle('active',s==='history');
}
render(); renderHistory();
</script>
</body>
</html>
